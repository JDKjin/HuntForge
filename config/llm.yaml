# 模型网关配置（OpenAI 兼容协议）
# 托管模式网关转换规则：
#   https://api.deepseek.com  →  http://api.deepseek.com.tsecbench.gw
#   (域名加 .tsecbench.gw 后缀, https 改 http)
# 本地模式（gateway.enabled=false 或未设环境变量）直连原始 URL。
# api_key 一律从环境变量读取，禁止硬编码。

gateway:
  enabled: false            # 托管模式置 true（或设环境变量 HUNTFORGE_GATEWAY=1）
  suffix: .tsecbench.gw
  force_http: true

# 模型路由（用户指定，最后一场调整）：全部 tier 统一
# deepseek-v4-flash + MAX 推理模式（reasoning_effort=max）。
tiers:
  fast:
    - id: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
  standard:
    - id: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
  deep:
    - id: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY

# 单次调用参数（deepseek 推理模型支持 reasoning_effort=low/medium/high/max，
# 推理消耗输出预算，max_tokens 给够；空 content 时网关翻倍重试）
chat:
  temperature: 0.2
  max_tokens: 4096
  timeout: 120
  # MAX 最大推理模式（用户指定）
  reasoning_effort: max

# 各 tier 覆盖：全部 max
tier_chat:
  fast:
    reasoning_effort: max
  standard:
    reasoning_effort: max
  deep:
    reasoning_effort: max

# 各 tier 输出预算（MAX 推理模式吃输出预算：推理 + 内容都给足，避免
# 空 content 触发网关翻倍重试）
tier_max_tokens:
  fast: 8192
  standard: 8192
  deep: 8192
