# 模型网关配置（OpenAI 兼容协议）
# 托管模式网关转换规则：
#   https://api.deepseek.com  →  http://api.deepseek.com.tsecbench.gw
#   (域名加 .tsecbench.gw 后缀, https 改 http)
# 本地模式（gateway.enabled=false 或未设环境变量）直连原始 URL。
# api_key 一律从环境变量读取，禁止硬编码。

gateway:
  enabled: false            # 托管模式置 true（或设环境变量 HUNTFORGE_GATEWAY=1）
  suffix: .tsecbench.gw
  force_http: true

# 模型按 tier 路由：recon/枚举用 fast；漏洞验证/分析用 standard；链推演/逆向用 deep。
# 每个 tier 首个模型为主，后续为 failover 备用。
tiers:
  fast:
    - id: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
    - id: glm-4-flash
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
  standard:
    - id: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
    - id: glm-4-flash
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
  deep:
    - id: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
    - id: glm-4-plus
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY

# 单次调用参数
chat:
  temperature: 0.2
  max_tokens: 2048
  timeout: 60
